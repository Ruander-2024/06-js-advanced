<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time handling</title>
    <style>
        /* Alap háttér */
        body {
            background-color: black;
            color: neonpink;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Neon hatású címek */
        h1, h2 {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            margin: 10px;
        }

        /* Gombok stílusa */
        button {
            background-color: #222;
            color: #ff00ff;
            border: 2px solid #ff00ff;
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px #ff00ff;
        }

        /* Gombok hover állapota */
        button:hover {
            background-color: #ff00ff;
            color: black;
            text-shadow: none;
            box-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff;
        }

        /* Gombok aktív állapota */
        button:active {
            box-shadow: none;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>setInterval() practice</h1>

    <h2 id="timer-text">0</h2>

    <button id="start-btn">Start</button>
    <button id="pause-btn">Pause</button>

    <script src="time_handling.js"></script>
</body>
</html>
