<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adatbázis lekérdezés</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8"
      crossorigin="anonymous"
    ></script>
    <style>
        /* Alap háttér */
        body {
            background-color: black;
            color: #ff00ff;
            font-family: Arial, sans-serif;
        }

        /* Neonhatás a címhez */
        h1 {
            color: #ff00ff;
            text-align: center;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            margin-bottom: 20px;
        }

        /* Táblázat stílus */
        #personTable {
            color: #ff00ff;
            background-color: #222;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 15px #ff00ff;
        }

        #personTable th, #personTable td {
            color: #ff00ff;
            border-color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }

        /* Gomb stílus */
        .btn-secondary {
            background-color: #222;
            color: #ff00ff;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px #ff00ff;
        }

        .btn-secondary:hover {
            background-color: #ff00ff;
            color: black;
            text-shadow: none;
            box-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff;
        }

        .btn-secondary:active {
            box-shadow: none;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container mt-3">
        <h1>Felhasználók</h1>
        <table id="personTable" class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Vezetéknév</th>
                    <th>Keresztnév</th>
                    <th>Kor</th>
                    <th>Nem</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- HTML kontent hozzáadása JS-ből -->
            </tbody>
        </table>
        <button class="btn btn-secondary" onclick="getData()">Adatok lekérése</button>
    </div>
    <script src="async_await.js"></script>
</body>
</html>
